version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: amplify-postgres
    restart: always
    environment:
      POSTGRES_USER: amplify
      POSTGRES_PASSWORD: amplify_password_2026
      POSTGRES_DB: amplify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amplify-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://amplify:amplify_password_2026@db:5432/amplify_db
      - SECRET_KEY=amplify-hackathon-super-secret-jwt-key-2026
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
